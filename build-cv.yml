name: Build CV downloads

# Rebuilds downloads/*.pdf and downloads/*.docx whenever the CV changes
on:
  push:
    branches: [main]
    paths:
      - cv.yaml
      - index.html
      - style.css
      - scripts/**
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add downloads
          git diff --staged --quiet || (git commit -m "Rebuild CV downloads" && git push)
