name: Build & deploy CV

# Builds the PDF/DOCX on every push and publishes the site with them.
# Nothing is committed: the files exist only on the published site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Prepare site folder
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git --exclude .github --exclude node_modules \
            --exclude scripts --exclude 'package*.json' --exclude _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
